server:
  port: 0

spring:
  application:
    name: evops-base
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:mem:evops-accept;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

shiro:
  annotations:
    enabled: false

# 验收测试不依赖真实触发：cron 推到 2099 年，定时扫描由测试手动调用服务验证幂等
aqua:
  disease:
    followup-scan-cron: "0 0 0 1 1 ? 2099"
  maint:
    generate-scan-cron: "0 0 0 1 1 ? 2099"
    escalate-scan-cron: "0 0 0 1 1 ? 2099"
  fulfill:
    # 验收中手工 POST /api/aqua/fulfill/outbox/scan 驱动恢复，定时不真实触发
    outbox-scan-cron: "0 0 0 1 1 ? 2099"
    gateway:
      mode: sim
  qual:
    # 验收中手工 POST /api/aqua/qual/scan 驱动扫描，定时不真实触发
    scan-cron: "0 0 0 1 1 ? 2099"
  report:
    # 验收中手工 POST /api/aqua/report/jobs/scan 驱动月报生成，定时不真实触发
    generate-scan-cron: "0 0 0 1 1 ? 2099"

logging:
  level:
    com.evops: INFO
